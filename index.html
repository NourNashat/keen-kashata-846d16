<style>
/* Layout: sticky toolbar, lesson rail on the right (RTL), question cards in a single reading column.
   Palette: ink-slate neutrals, cobalt brand, green reserved for correct answers, red for wrong picks in test mode. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eaeef5; --line:#d9dfea;
  --fg:#16202e; --muted:#5a6678;
  --brand:#2447c9; --brand-soft:#e4eafc; --brand-fg:#ffffff;
  --ok:#0f8a4b; --ok-bg:#e3f6ea; --ok-line:#8fd2aa; --ok-fg:#0a5a31;
  --bad:#c0392b; --bad-bg:#fcebe8; --bad-line:#eeaaa2;
  --shadow:0 1px 2px rgba(22,32,46,.06),0 6px 18px rgba(22,32,46,.05);
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#0e1420; --surface:#161e2d; --surface-2:#1e2839; --line:#2a3548;
  --fg:#e7ecf5; --muted:#9aa7bc;
  --brand:#7f9bff; --brand-soft:#1d2a52; --brand-fg:#0e1420;
  --ok:#4cd18a; --ok-bg:#12301f; --ok-line:#276a46; --ok-fg:#a6ecc6;
  --bad:#ff8d80; --bad-bg:#3a1b19; --bad-line:#7a3b35;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
html{direction:rtl;scroll-behavior:smooth;scroll-padding-top:150px}
body{direction:rtl;text-align:start}
.mono-ltr{direction:ltr;unicode-bidi:isolate}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin-inline:auto}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.bar-in{max-width:1120px;margin-inline:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-inline-end:auto}
.logo{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--brand-fg);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.05rem;line-height:1.3;margin:0;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:.85rem;line-height:1.3}
.search{position:relative;flex:1 1 240px;max-width:380px;min-width:0}
.search input{width:100%;height:42px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding-inline:40px 12px}
.search svg{position:absolute;inset-inline-start:12px;top:12px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center}
.btn{height:42px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding-inline:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand)}
.btn.icon{width:42px;padding:0;justify-content:center}

/* layout */
.shell{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding-top:24px;align-items:start}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);display:flex;flex-direction:column;gap:8px}
.rail h2{font-size:.78rem;letter-spacing:.04em;color:var(--muted);margin:0 0 4px;font-weight:600}
.lesson-btn{text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:2px}
.lesson-btn .n{font-size:.78rem;color:var(--muted)}
.lesson-btn .t{font-weight:600;line-height:1.45}
.lesson-btn .c{font-size:.78rem;color:var(--muted)}
.lesson-btn[aria-current="true"]{border-color:var(--brand);background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.legend{margin-top:10px;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:.84rem;color:var(--muted);display:grid;gap:8px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-inline-end:6px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.hero .k{font-size:.8rem;color:var(--brand);font-weight:700}
.hero h2{margin:2px 0 0;font-size:1.55rem;line-height:1.4;text-wrap:balance}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--surface-2);border-radius:12px;padding:8px 14px;min-width:84px}
.stat b{display:block;font-size:1.25rem;line-height:1.3;font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;cursor:pointer;font-weight:500;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.score{margin-inline-start:auto;font-size:.88rem;color:var(--muted);align-self:center}

/* sections */
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--line);margin-bottom:16px}
.sec-h h3{margin:0;font-size:1.2rem;text-wrap:balance}
.tag{font-size:.76rem;font-weight:600;background:var(--brand-soft);color:var(--brand);border-radius:6px;padding:2px 10px}
.sub{font-size:.9rem;font-weight:700;color:var(--muted);margin:18px 0 10px}
.cards{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.q{display:flex;gap:12px;align-items:flex-start;margin:0 0 12px;font-weight:600;line-height:1.7}
.num{flex:none;min-width:30px;height:30px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--mono);font-size:.82rem;color:var(--muted)}

/* essay answer */
details.ans{border:1px solid var(--ok-line);background:var(--ok-bg);border-radius:12px;color:var(--fg)}
details.ans>summary{cursor:pointer;list-style:none;padding:10px 14px;font-weight:700;color:var(--ok-fg);display:flex;align-items:center;gap:8px}
details.ans>summary::-webkit-details-marker{display:none}
details.ans>summary::after{content:"";margin-inline-start:auto;width:8px;height:8px;border-inline-end:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .15s}
details.ans[open]>summary::after{transform:rotate(-135deg)}
.ans-body{padding:2px 16px 14px;border-top:1px solid var(--ok-line)}
.ans-body p{margin:10px 0 0}
.ans-body ul,.ans-body ol{margin:8px 0 0;padding-inline-start:24px}
.ans-body li{margin:3px 0}
.ans-body .eq{margin:12px 0 0;text-align:center;font-weight:700;background:var(--surface);border:1px dashed var(--ok-line);border-radius:10px;padding:8px 12px}
.ans-body b{color:var(--ok-fg)}
.tbl{overflow-x:auto;margin-top:10px}
.tbl table{border-collapse:collapse;width:100%;min-width:440px;background:var(--surface);border-radius:8px;overflow:hidden}
.tbl th,.tbl td{border:1px solid var(--ok-line);padding:8px 12px;text-align:start;vertical-align:top}
.tbl th{background:var(--ok-bg);color:var(--ok-fg)}
.tbl.plain th,.tbl.plain td{border-color:var(--line)}
.tbl.plain th{background:var(--surface-2);color:var(--fg)}

/* mcq */
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:start;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;cursor:pointer;line-height:1.6}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt .m{margin-inline-start:auto;flex:none;display:none}
.opt:not([disabled]):hover{border-color:var(--brand)}
.opt[disabled]{cursor:default}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok-fg);font-weight:600}
.opt.ok .l{background:var(--ok);color:var(--bg)}
.opt.ok .m{display:block}
.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt.bad .l{background:var(--bad);color:var(--bg)}
.why{margin-top:12px;border-radius:10px;padding:10px 14px;background:var(--ok-bg);border:1px solid var(--ok-line);color:var(--fg);font-size:.95rem}
.why b{color:var(--ok-fg)}
.empty{text-align:center;color:var(--muted);padding:60px 10px}
mark{background:#ffe27a;color:#222;border-radius:3px;padding:0 2px}
.foot{margin-top:44px;text-align:center;color:var(--muted);font-size:.84rem}

.mnav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{display:none}
  .mnav{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px}
  .mnav .lesson-btn{flex:0 0 auto;min-width:200px}
  html{scroll-padding-top:200px}
  .hero{padding:18px}
  .hero h2{font-size:1.25rem}
}
@media (max-width:520px){
  .btn .lbl{display:none}
  .btn.mode .lbl{display:inline}
  .card{padding:16px}
}
.card,.q>span:last-child,.opt>span:nth-child(2),.why,.ans-body,.hero h2{min-width:0;overflow-wrap:anywhere}
.opt>span:nth-child(2){flex:1}
@media (max-width:860px){
  /* phone: compact header (title + buttons on row one, full-width search on row two), not sticky so it doesn't eat the screen */
  .bar{position:static}
  .bar-in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding-block:12px}
  .brand{grid-column:1;grid-row:1}
  .tools{grid-column:2;grid-row:1}
  .search{grid-column:1/-1;grid-row:2;max-width:none;flex:none}
  .brand h1{font-size:1rem;white-space:nowrap}
  html{scroll-padding-top:16px}
  .mnav{margin-inline:-4px;padding-inline:4px;scroll-snap-type:x proximity}
  .mnav .lesson-btn{scroll-snap-align:start;min-width:220px}
  .shell{padding-top:12px}
  .sec{margin-top:24px}
  .sec-h h3{font-size:1.08rem}
  .score{flex-basis:100%;margin:0}
}
@media (max-width:520px){
  body{font-size:15.5px}
  .hero{gap:12px;border-radius:14px}
  .stats{width:100%}
  .stat{flex:1}
  .card{padding:14px;border-radius:12px}
  .q{gap:10px}
  .num{min-width:28px;height:28px}
  .opt{padding:10px 12px;gap:10px}
  .ans-body{padding:2px 12px 12px}
  .ans-body ul,.ans-body ol{padding-inline-start:20px}
  details.ans>summary{padding:10px 12px}
  .tbl table{min-width:0;font-size:.86rem}
  .tbl th,.tbl td{padding:6px 8px}
  .chip{padding:6px 14px;font-size:.86rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
document.documentElement.setAttribute("dir","rtl");
document.documentElement.setAttribute("lang","ar");
/* ---------- data ---------- */
const E=(q,a)=>({q,a});
const M=(q,o,c,w)=>({q,o,c,w});
const S=(p,t,e,m)=>({p,t,e,m});
const MATH="درجة الخطر = التأثير × الاحتمالية";

const LESSONS=[
{id:"l1",no:"الدرس الأول",title:"تقنيات التشفير والمصادقة",secs:[

S(1,"المهام الأدائية",[
E("اشرح كيف تعمل اتصالات HTTPS على حماية الاتصال، وما دور بروتوكول TLS في ذلك؟",
`يعمل بروتوكول HTTPS على حماية الاتصال بين متصفح المستخدم وخادم الويب من خلال استخدام بروتوكول TLS، الذي يوفر ثلاث وظائف أساسية:
1. **سرية البيانات:** تشفير البيانات أثناء انتقالها عبر الشبكة لمنع الأطراف غير المصرح لها من قراءتها.
2. **سلامة البيانات:** اكتشاف أي تعديل أو تلاعب بالبيانات أثناء انتقالها.
3. **التحقق من هوية الخادم:** استخدام الشهادة الرقمية للتحقق من هوية الخادم وارتباط الشهادة باسم النطاق الذي يتصل به المتصفح.
ويتم ذلك من خلال **مصافحة TLS**، حيث يتحقق المتصفح من شهادة الخادم، ثم يتفق الطرفان على أسرار مشتركة تُشتق منها مفاتيح الجلسة، وبعد ذلك تُحمى البيانات باستخدام التشفير المتماثل.
وبذلك يوفر HTTPS اتصالًا آمنًا يحمي البيانات أثناء انتقالها بين المستخدم والموقع الإلكتروني.`),
E("ميز بين دور كل من التشفير المتماثل والتشفير بالمفتاح العام أثناء تدفق اتصال HTTPS؟",
`يختلف دور التشفير المتماثل عن التشفير بالمفتاح العام في اتصال HTTPS من حيث الاستخدام والهدف:
- **التشفير بالمفتاح العام:** يعتمد على زوج من المفاتيح المرتبطة، مفتاح عام ومفتاح خاص، وتُستخدم آليات المفتاح العام أثناء مصافحة TLS للمساعدة في المصادقة والاتفاق الآمن على الأسرار المشتركة التي تُشتق منها مفاتيح الجلسة.
- **التشفير المتماثل:** يعتمد على مفتاح سري مشترك بين طرفي الاتصال، ويُستخدم بعد إنشاء مفاتيح الجلسة لحماية البيانات المتبادلة بسرعة وكفاءة.
**الفرق الأساسي:** التشفير بالمفتاح العام يساعد في بدء الاتصال الآمن والاتفاق على مفاتيح الجلسة، بينما التشفير المتماثل يحمي بيانات الجلسة نفسها بكفاءة عالية.`)],
[
M("أي من التقنيات التالية يُستخدم أساساً لتشفير بيانات الجلسة بسرعة وكفاءة عالية بعد اكتمال عملية المصافحة واتفاق الأمان؟",["التشفير بالمفتاح العام.","التشفير المتماثل.","التوقيع الرقمي.","الشهادة الرقمية."],1,"لأن التشفير المتماثل أسرع وأكثر كفاءة عند تشفير كميات كبيرة من البيانات، ولذلك يُستخدم لحماية بيانات الجلسة بعد إنشاء مفاتيحها."),
M("ماذا تسمى الخطوات الخاصة بإنشاء الاتصال الآمن والتحقق من هوية الخادم واسم النطاق عبر بروتوكول HTTPS؟",["مصافحة TLS.","التوقيع الرقمي.","المصادقة الثنائية.","التشفير المتماثل."],0,"مصافحة TLS هي مجموعة الخطوات التي يتم خلالها التحقق من شهادة الخادم، والاتفاق على إعدادات الحماية، واشتقاق مفاتيح الجلسة اللازمة لإنشاء الاتصال الآمن.")]),

S(1,"أداءات منزلية",[
E("ما المقصود بمصطلح «المصادقة الثنائية (2FA)»، وكيف يقلل استخدام عامل مستقل ثانٍ من مخاطر الدخول غير المصرح به؟",
`المصادقة الثنائية (2FA) هي أسلوب للتحقق من هوية المستخدم باستخدام عاملين مستقلين من فئتين مختلفتين.
وتنقسم عوامل المصادقة إلى ثلاث فئات أساسية:
1. **المعرفة:** شيء يعرفه المستخدم، مثل كلمة المرور أو الرقم السري.
2. **الحيازة:** شيء يمتلكه المستخدم، مثل الهاتف المحمول أو بطاقة ذكية أو رمز تحقق لمرة واحدة.
3. **السمات الحيوية:** شيء يميز المستخدم جسديًا، مثل بصمة الإصبع أو التعرف على الوجه.
يساعد العامل الثاني المستقل في تقليل مخاطر الدخول غير المصرح به؛ لأنه حتى إذا تمكن شخص من معرفة كلمة مرور المستخدم، فلن يستطيع الدخول إلى الحساب دون امتلاك العامل الثاني أو اجتياز وسيلة التحقق الإضافية.
**مثال:** عند تسجيل الدخول إلى حساب مصرفي، يُدخل المستخدم كلمة المرور، ثم يُطلب منه إدخال رمز تحقق يُرسل إلى هاتفه. وبالتالي لا تكفي معرفة كلمة المرور وحدها للدخول.`),
E("اذكر الفروق الأساسية بين المصادقة الثنائية (2FA) والمصادقة متعددة العوامل (MFA) من حيث عدد وفئات العوامل المستخدمة؟",
`- **المصادقة الثنائية (2FA):** تستخدم عاملين مستقلين من فئتين مختلفتين لإثبات هوية المستخدم، مثل كلمة المرور (المعرفة) ورمز تحقق على الهاتف (الحيازة).
- **المصادقة متعددة العوامل (MFA):** تستخدم عاملين أو أكثر من فئات مختلفة، مثل المعرفة والحيازة والسمات الحيوية.
**الفرق الأساسي:** المصادقة الثنائية تستخدم عاملين تحديدًا من فئتين مختلفتين، أما المصادقة متعددة العوامل فتستخدم عاملين أو أكثر من فئات مختلفة.`)],
[
M("أي من الخيارات التالية يمثل عاملين من فئتين مختلفتين تماماً (المعرفة والحيازة) يُستخدمان في المصادقة الثنائية للخدمات المصرفية؟",["كلمة مرور + كلمة مرور ثانية نصية.","كلمة مرور + كلمة مرور لمرة واحدة (OTP).","بصمة الإصبع + التعرف على الوجه.","بطاقة هوية ورقية + اسم المستخدم فقط."],1,"كلمة المرور تمثل عامل المعرفة، بينما كلمة المرور لمرة واحدة المرسلة إلى الهاتف تمثل عامل الحيازة؛ لأن المستخدم يحتاج إلى امتلاك الجهاز الذي يستقبل الرمز."),
M("ماذا يُقصد بمصطلح المصادقة متعددة العوامل (MFA)؟",["استخدام كلمة مرور واحدة قوية ومعقدة للغاية.","استخدام عاملين أو أكثر من فئات مختلفة مثل المعرفة والحيازة والسمات الحيوية.","الاعتماد حصراً على بصمة الإصبع فقط لتسجيل الدخول.","استخدام عنوان البريد الإلكتروني مع كلمة المرور التقليدية."],1,"المصادقة متعددة العوامل تعتمد على استخدام أكثر من عامل لإثبات الهوية، بشرط أن تكون العوامل من فئات مختلفة، مثل كلمة المرور وبصمة الإصبع.")]),

S(2,"المهام الأدائية",[
E("ما الدور الأساسي للشهادة الرقمية وآليات المفتاح العام في بدء اتصال TLS آمن؟",
`تؤدي الشهادة الرقمية وآليات المفتاح العام دورًا أساسيًا في بدء اتصال TLS آمن من خلال:
1. يرسل خادم الويب شهادته الرقمية إلى المتصفح أثناء مصافحة TLS.
2. يتحقق المتصفح من صلاحية الشهادة وسلسلة الثقة وملاءمتها لاسم الموقع أو النطاق الذي يتصل به.
3. تساعد آليات المفتاح العام في المصادقة والاتفاق الآمن على الأسرار المشتركة التي تُشتق منها مفاتيح الجلسة.
4. بعد إنشاء مفاتيح الجلسة، يستخدم الطرفان التشفير المتماثل لحماية البيانات المتبادلة.
وبذلك تساعد الشهادة الرقمية على التحقق من هوية الخادم، بينما تساعد آليات المفتاح العام في المصادقة والاتفاق الآمن على مفاتيح الجلسة.`),
E("قارن بإيجاز بين وظيفة التوقيع الرقمي ووظيفة الشهادة الرقمية في أنظمة الأمان.",
`- **التوقيع الرقمي:** يُستخدم للتحقق من سلامة البيانات وهوية الشخص أو الجهة الموقعة، حيث يساعد على اكتشاف التلاعب بالرسائل والبيانات، ويوفر دليلًا يدعم عدم التنصل.
- **الشهادة الرقمية:** تساعد المتصفح على التحقق من هوية الخادم وارتباط الشهادة باسم النطاق الذي يتصل به.
**الفرق الأساسي:** التوقيع الرقمي يثبت سلامة رسالة أو بيانات وهوية موقّعها، بينما الشهادة الرقمية تساعد على التحقق من هوية الخادم وارتباطه باسم النطاق.`)],
[
M("ما هي التقنية التي تساعد المتصفح على التحقق من هوية الخادم وارتباط الشهادة باسم النطاق الذي يتصل به؟",["التشفير المتماثل.","التوقيع الرقمي.","الشهادة الرقمية.","المصادقة الثنائية."],2,"الشهادة الرقمية تحتوي على معلومات تساعد المتصفح على التحقق من هوية الخادم وارتباط الشهادة باسم النطاق الصحيح."),
M("أي من التقنيات الآتية تكتشف التلاعب وانتحال الشخصية وتوفر دليلًا يدعم عدم التنصل؟",["التشفير المتماثل.","التوقيع الرقمي.","مصافحة TLS.","المصادقة الثنائية."],1,"التوقيع الرقمي يساعد على اكتشاف تعديل البيانات والتحقق من هوية الموقّع، كما يوفر دليلًا يدعم عدم التنصل؛ أي يصعب على الموقّع إنكار توقيعه على البيانات لاحقًا.")]),

S(2,"أداءات منزلية",[
E("اشرح باختصار كيف يتم الجمع بين تقنيات الأمان المختلفة (التشفير، الشهادات، المصادقة الثنائية) عند إتمام عملية شراء عبر متجر إلكتروني.",
`عند إجراء عملية شراء عبر متجر إلكتروني، يتم الجمع بين عدة تقنيات أمان لحماية المستخدم والبيانات، وذلك كالتالي:
1. **التشفير:** عند الدخول إلى المتجر باستخدام HTTPS، يتم تشفير الاتصال لحماية البيانات من القراءة بواسطة أطراف ثالثة، كما يحافظ TLS على سرية البيانات وسلامتها أثناء النقل.
2. **الشهادة الرقمية:** يتحقق المتصفح من الشهادة الرقمية واسم النطاق للتأكد من هوية الخادم الذي يتصل به المستخدم.
3. **المصادقة الثنائية (2FA):** عند تسجيل الدخول، يُطلب من المستخدم إثبات هويته باستخدام عاملين مستقلين، مما يقلل احتمال الدخول غير المصرح به.
4. **التوقيع الرقمي:** يُستخدم عند الحاجة لإثبات التوقيع على بيانات أو رسائل محددة والتحقق من سلامتها وهوية الموقّع.
وبذلك تعمل هذه التقنيات معًا لتقليل مخاطر التنصت والتلاعب وانتحال الهوية والوصول غير المصرح به.`),
E("لماذا لا يُكتفى بتقنية أمان واحدة فقط لضمان حماية الخدمات والاتصالات عبر الإنترنت، وما هي الفائدة العملية لتعدد الطبقات؟",
`لا يُكتفى باستخدام تقنية أمان واحدة؛ لأن كل تقنية تعالج نوعًا معينًا من التهديدات، ولا تستطيع تقنية واحدة توفير جميع جوانب الحماية.
فعلى سبيل المثال:
- التشفير يمنع الأطراف الثالثة من قراءة محتوى الاتصال.
- الشهادات الرقمية تساعد على التحقق من هوية الخادم واسم النطاق.
- التوقيعات الرقمية تساعد على اكتشاف التلاعب والتحقق من هوية الموقّع.
- المصادقة الثنائية تقلل احتمال الدخول غير المصرح به.
وتتمثل الفائدة العملية لتعدد الطبقات في معالجة تهديدات مختلفة في الوقت نفسه، وتقليل احتمال نجاح الهجمات، بحيث لا يؤدي فشل إحدى وسائل الحماية بالضرورة إلى اختراق النظام بالكامل.
**الخلاصة:** الحماية الفعالة تعتمد على الجمع بين تقنيات أمان متعددة، وليس على الاعتماد على تقنية واحدة فقط.`)],
[
M("أي من التقنيات التالية تمنع قراءة محتوى الاتصال من قبل أطراف ثالثة أثناء نقل البيانات عبر الشبكة؟",["التشفير (بالمفتاح المتماثل والمفتاح العام).","التوقيع الرقمي.","المصادقة الثنائية (2FA).","الشهادة الرقمية."],0,"التشفير يحول البيانات إلى صيغة غير مفهومة دون امتلاك مفاتيح فك التشفير المناسبة، وبالتالي يمنع الأطراف الثالثة من قراءة محتوى الاتصال."),
M("من بين الخيارات التالية، أي خيار يُعد مثالاً خاطئاً للمصادقة الثنائية لأنه يعتمد على نفس فئة العامل (المعرفة)؟",["كلمة مرور + كلمة مرور لمرة واحدة ترسل للهاتف.","كلمة مرور + بصمة الإصبع.","كلمة مرور + كلمة مرور سرية ثانية.","كلمة مرور + رمز من تطبيق مصادقة."],2,"كلمة المرور وكلمة المرور السرية الثانية تنتميان إلى فئة المعرفة؛ لذلك لا يمثل استخدامهما مصادقة ثنائية بعاملين من فئتين مختلفتين، حتى لو كانتا كلمتي مرور مختلفتين.")]),

S(3,"النموذج (A)",[
E("اشرح بالتفصيل كيف تستخدم اتصالات HTTPS تقنيات مختلفة لحماية الاتصال منذ لحظة بدء المصافحة وحتى تبادل البيانات.",
`تعتمد اتصالات HTTPS على بروتوكول TLS لتأمين الاتصال بين متصفح المستخدم وخادم الويب، وتمر عملية إنشاء الاتصال الآمن بثلاث مراحل أساسية:
1. **المرحلة الأولى – التحقق من الشهادة الرقمية:**
- يرسل الخادم شهادته الرقمية إلى المتصفح.
- يتحقق المتصفح من صلاحية الشهادة وسلسلة الثقة وملاءمتها لاسم النطاق الذي يتصل به.
- تساعد هذه الخطوة على التأكد من هوية الخادم.
2. **المرحلة الثانية – اشتقاق مفاتيح الجلسة:**
- يتفاوض الطرفان على إعدادات الحماية ويتبادلان معاملات تبادل المفاتيح.
- تُشتق أسرار مشتركة تُستخدم لإنشاء مفاتيح الجلسة.
- لا يُرسل مفتاح الجلسة نفسه عبر الشبكة.
3. **المرحلة الثالثة – تبادل البيانات:**
- بعد اكتمال المصافحة، تُحمى البيانات باستخدام التشفير المتماثل.
- تُستخدم آليات سلامة البيانات لاكتشاف التلاعب أثناء انتقال البيانات.
وبذلك يجمع HTTPS بين آليات المفتاح العام للتحقق والاتفاق الآمن على مفاتيح الجلسة، والتشفير المتماثل لحماية البيانات بسرعة وكفاءة.`),
E("ميز بدقة بين دور التشفير المتماثل والتشفير بالمفتاح العام، موضحاً سبب استخدام كل منهما في مراحل اتصال HTTPS.",
`|وجه المقارنة|التشفير بالمفتاح العام|التشفير المتماثل
|المفاتيح|زوج من المفاتيح المرتبطة: عام وخاص|مفتاح سري مشترك
|الاستخدام في HTTPS|المصادقة والاتفاق الآمن على أسرار الجلسة|حماية بيانات الجلسة
|المرحلة|مصافحة TLS|بعد اكتمال المصافحة
|السرعة والكفاءة|أبطأ نسبيًا في العمليات التشفيرية المناسبة له|أسرع وأكثر كفاءة في تشفير البيانات الكثيرة
**سبب استخدام كل منهما:**
يُستخدم التشفير بالمفتاح العام أثناء المصافحة للمساعدة في المصادقة والاتفاق الآمن على الأسرار المشتركة التي تُشتق منها مفاتيح الجلسة.
أما التشفير المتماثل فيُستخدم بعد ذلك لحماية البيانات المتبادلة؛ لأنه يوفر سرعة وكفاءة أعلى عند التعامل مع كميات كبيرة من البيانات.`),
E("وضح بمثال عملي كيف تستخدم المصادقة الثنائية في تسجيل الدخول إلى حسابات وسائل التواصل الاجتماعي أو الخدمات المصرفية.",
`تُستخدم المصادقة الثنائية لإضافة طبقة حماية إضافية إلى حساب المستخدم من خلال طلب عاملين مستقلين من فئتين مختلفتين لإثبات هويته.
**مثال: تسجيل الدخول إلى حساب مصرفي:**
1. يفتح المستخدم التطبيق المصرفي ويُدخل اسم المستخدم وكلمة المرور.
2. يتحقق النظام من صحة كلمة المرور، وهي عامل من فئة المعرفة.
3. يطلب النظام إدخال رمز تحقق لمرة واحدة (OTP) يُرسل إلى الهاتف أو يُنشأ بواسطة تطبيق مصادقة، وهو عامل من فئة الحيازة.
4. بعد التحقق من صحة العاملين، يسمح النظام للمستخدم بالدخول إلى الحساب.
**الفائدة الأمنية:** إذا تمكن شخص من معرفة كلمة المرور، فلن يستطيع الدخول بسهولة دون امتلاك الهاتف أو وسيلة التحقق الثانية.`),
E("ناقش العبارة التالية: «يعتمد الاتصال والخدمات الآمنة عبر الإنترنت على الجمع بين التشفير والمصادقة، وليس على تقنية واحدة فقط». مبيناً دور كل تقنية مجتمعة؟",
`العبارة صحيحة؛ لأن حماية الاتصالات والخدمات عبر الإنترنت تتطلب مواجهة تهديدات متعددة، ولا تستطيع تقنية واحدة التعامل مع جميع هذه التهديدات.
وتتكامل التقنيات المختلفة كالتالي:
1. **التشفير:** يحمي سرية البيانات ويمنع الأطراف الثالثة من قراءة محتوى الاتصال.
2. **الشهادات الرقمية:** تساعد المتصفح على التحقق من هوية الخادم واسم النطاق.
3. **التوقيعات الرقمية:** تساعد على اكتشاف التلاعب والتحقق من سلامة البيانات وهوية الموقّع، وتوفر دليلًا يدعم عدم التنصل.
4. **المصادقة الثنائية:** تقلل احتمال الدخول غير المصرح به باستخدام عاملين مستقلين.
**مثال عملي:** عند الشراء من متجر إلكتروني، يحمي HTTPS الاتصال بالتشفير، ويتحقق المتصفح من شهادة الموقع، وتساعد المصادقة الثنائية في حماية حساب المستخدم، بينما يمكن استخدام التوقيع الرقمي لإثبات التوقيع على بيانات محددة عند الحاجة.
وبذلك يؤدي الجمع بين هذه التقنيات إلى إنشاء طبقات متعددة من الحماية وتقليل مخاطر التنصت والتلاعب وانتحال الهوية والدخول غير المصرح به.`)],
[
M("بروتوكول HTTP منقول عبر اتصال TLS مؤمن يوفر سرية البيانات وسلامتها أثناء النقل يُعرف بـ:",["HTTPS.","FTP.","SMTP.","DNS."],0,"HTTPS هو بروتوكول HTTP يعمل عبر اتصال TLS مؤمّن، مما يوفر حماية للبيانات أثناء انتقالها."),
M("استخدام عاملين مستقلين من فئتين مختلفتين لإثبات الهوية يُعرف بـ:",["التشفير المتماثل.","المصادقة الثنائية (2FA).","التوقيع الرقمي.","الشهادة الرقمية."],1,"لأنها تعتمد على عاملين مستقلين من فئتين مختلفتين، مثل كلمة المرور ورمز تحقق على الهاتف."),
M("تقنية تكتشف التلاعب وانتحال الشخصية وتوفر دليلاً يدعم عدم التنصل هي:",["التوقيع الرقمي.","التشفير بالمفتاح العام.","مصافحة TLS.","الحوسبة السحابية."],0,"التوقيع الرقمي يساعد على التأكد من سلامة البيانات وهوية الموقّع، ويوفر دليلًا يدعم عدم التنصل."),
M("أي من الخيارات الآتية يمثل فئات عوامل المصادقة متعددة العوامل (MFA) بدقة؟",["المعرفة والحيازة والسمات الحيوية.","السرعة والكفاءة والتكلفة.","المفتاح العام والمفتاح الخاص وكلمة المرور.","الاتصال اللاسلكي والشبكة المحلية والسحابة."],0,"هذه هي الفئات الثلاث الأساسية لعوامل المصادقة: شيء تعرفه، وشيء تمتلكه، وشيء يميزك حيويًا.")]),

S(3,"النموذج (B)",[
E("اشرح الخطوات الأساسية التي تحدث خلال «مصافحة TLS» وكيف يتحقق المتصفح من شهادة الخادم.",
`تتم مصافحة TLS من خلال خطوات أساسية لإنشاء اتصال آمن بين المتصفح وخادم الويب:
1. يرسل الخادم شهادته الرقمية إلى المتصفح.
2. يتحقق المتصفح من صلاحية الشهادة وسلسلة الثقة وملاءمتها لاسم النطاق الذي يتصل به.
3. يتفق الطرفان على إعدادات الحماية وآليات تبادل المفاتيح المناسبة.
4. يشتق كل طرف مفاتيح الجلسة لديه من الأسرار المشتركة دون إرسال مفتاح الجلسة نفسه عبر الشبكة.
5. بعد اكتمال المصافحة، يستخدم الطرفان التشفير المتماثل وآليات سلامة البيانات لحماية الاتصال.
وبذلك تساعد المصافحة على التحقق من هوية الخادم وإنشاء مفاتيح الجلسة اللازمة لتأمين تبادل البيانات.`),
E("وضح لماذا يكون استخدام التشفير بالمفتاح العام لجميع البيانات المتبادلة بطيئاً، وكيف يعالج بروتوكول TLS هذه المشكلة باستخدام مفاتيح الجلسة.",
`يكون استخدام التشفير بالمفتاح العام لجميع البيانات المتبادلة بطيئًا نسبيًا؛ لأنه يعتمد على عمليات تشفير مرتبطة بزوج من المفاتيح، وهي أكثر تكلفة حسابية من عمليات التشفير المتماثل.
ولذلك يعالج بروتوكول TLS هذه المشكلة من خلال تقسيم عملية الحماية إلى مرحلتين:
1. **أثناء المصافحة:** يستخدم آليات المفتاح العام للمساعدة في المصادقة والاتفاق الآمن على أسرار مشتركة تُشتق منها مفاتيح الجلسة.
2. **بعد المصافحة:** يستخدم التشفير المتماثل لحماية بيانات الجلسة؛ لأنه أسرع وأكثر كفاءة في التعامل مع كميات كبيرة من البيانات.
وبذلك يجمع TLS بين الأمان والكفاءة، دون الحاجة إلى استخدام التشفير بالمفتاح العام لكل البيانات المتبادلة.`),
E("قارن بين فئات عوامل المصادقة المختلفة (المعرفة، الحيازة، السمات الحيوية) مع ذكر مثال لكل فئة منها.",
`تنقسم عوامل المصادقة إلى ثلاث فئات أساسية:
1. **المعرفة (Knowledge):** تعتمد على شيء يعرفه المستخدم، مثل كلمة المرور أو الرقم السري.
2. **الحيازة (Possession):** تعتمد على شيء يمتلكه المستخدم، مثل الهاتف المحمول أو البطاقة الذكية أو رمز التحقق لمرة واحدة (OTP).
3. **السمات الحيوية (Biometrics):** تعتمد على صفة جسدية تميز المستخدم، مثل بصمة الإصبع أو التعرف على الوجه.
ويُستخدم الجمع بين عاملين من فئتين مختلفتين لتطبيق المصادقة الثنائية، بينما تستخدم المصادقة متعددة العوامل عاملين أو أكثر من فئات مختلفة.`),
E("اشرح كيف يمنع استخدام عامل ثانٍ مستقل (مثل تطبيق المصادقة أو رمز الرسائل القصيرة) اختراق الحساب حتى لو تسربت كلمة المرور الأساسية.",
`يساعد العامل الثاني المستقل على حماية الحساب من الدخول غير المصرح به؛ لأنه يضيف خطوة تحقق أخرى من فئة مختلفة عن كلمة المرور.
فعلى سبيل المثال، إذا تسربت كلمة مرور المستخدم إلى شخص آخر، فلن تكفي هذه الكلمة وحدها للدخول إلى الحساب، حيث سيطلب النظام رمز تحقق إضافيًا من تطبيق المصادقة أو رسالة قصيرة تصل إلى هاتف المستخدم.
وبذلك يحتاج المهاجم إلى امتلاك العامل الثاني أيضًا حتى يتمكن من الدخول، مما يقلل احتمال اختراق الحساب.
ومع ذلك، فإن المصادقة الثنائية تقلل المخاطر ولا توفر حماية مطلقة؛ إذ قد تتعرض وسائل التحقق نفسها لهجمات مثل سرقة الهاتف أو خداع المستخدم للحصول على رمز التحقق.`)],
[
M("زوج من المفاتيح المرتبطة يتكون من مفتاح عام ومفتاح خاص يُستخدم في التشفير لتأمين الاتصال هو:",["التشفير بالمفتاح العام.","التشفير المتماثل.","الكيوبت الكمومي.","البت الكلاسيكي."],0,"التشفير بالمفتاح العام يعتمد على زوج من المفاتيح المرتبطة، أحدهما عام والآخر خاص."),
M("خدمة أو نظام يساعد المتصفح على التحقق من هوية الخادم ومن مطابقة اسم النطاق للشهادة الرقمية:",["التوقيع الرقمي.","الشهادة الرقمية.","التشفير المتماثل.","المصادقة الثنائية."],1,"الشهادة الرقمية هي التي تساعد المتصفح على التحقق من هوية الخادم وارتباط الشهادة باسم النطاق."),
M("أي من الخيارات التالية يعد مثالاً صحيحاً لعامل «الحيازة» في المصادقة الثنائية؟",["معرفة السؤال السري.","كلمة مرور لمرة واحدة مرسلة للهاتف أو بطاقة ذكية.","بصمة الإصبع الخاصة بالمستخدم.","التعرف على ملامح الوجه."],1,"الهاتف أو البطاقة الذكية يمثلان شيئًا يمتلكه المستخدم، ولذلك ينتميان إلى فئة الحيازة."),
M("تركيبات تقنيات الأمان في المتاجر الإلكترونية تضمن حماية التسجيل والدفع من خلال:",["الاعتماد على تقنية واحدة فقط لسرعة التنفيذ.","الجمع بين التشفير والشهادات والتوقيعات والمصادقة الثنائية لتقليل المخاطر المتعددة.","إلغاء استخدام كلمات المرور نهائياً.","الاكتفاء بالتشفير المتماثل دون أي مصادقة."],1,"الجمع بين تقنيات الأمان المختلفة يوفر طبقات حماية متعددة، بحيث تعالج كل تقنية نوعًا من التهديدات.")]),

S(3,"النموذج (C)",[
E("اشرح بالتفصيل كيف تساهم الشهادات الرقمية وسلسلة الثقة في تمكين المتصفح من التحقق من صحة وملاءمة اسم الموقع الخادم.",
`تساعد الشهادات الرقمية المتصفح على التحقق من هوية خادم الويب وارتباطه باسم النطاق الذي يتصل به المستخدم.
وتتم العملية كالتالي:
1. يرسل خادم الويب شهادته الرقمية إلى المتصفح أثناء مصافحة TLS.
2. يتحقق المتصفح من صلاحية الشهادة، مثل كونها ضمن فترة الصلاحية المحددة.
3. يتحقق المتصفح من سلسلة الثقة، أي أن الشهادة صادرة عن جهة إصدار شهادات موثوقة، أو يمكن ربطها بجهة موثوقة من خلال سلسلة الشهادات.
4. يتحقق المتصفح من أن اسم النطاق الموجود في الشهادة يتوافق مع الموقع الذي يحاول المستخدم الاتصال به.
5. إذا اجتازت الشهادة عمليات التحقق المطلوبة، يمكن للمتصفح متابعة إنشاء الاتصال الآمن.
**أهمية ذلك:** تساعد هذه العملية على تقليل خطر انتحال المواقع وتوجيه المستخدم إلى خادم مزيف يدّعي أنه الموقع الحقيقي.`),
E("تكلم باختصار عن التوقيع الرقمي مبيناً خصائصه، وكيف يساعد في اكتشاف التلاعب وانتحال الشخصية وتوفير دليل عدم التنصل.",
`التوقيع الرقمي هو وسيلة تشفيرية تُستخدم للتحقق من سلامة البيانات وهوية الجهة أو الشخص الذي وقّع عليها.
ومن أهم خصائصه:
1. **اكتشاف التلاعب:** يساعد على اكتشاف أي تعديل يحدث في البيانات بعد توقيعها؛ لأن التحقق من التوقيع سيفشل إذا تغير المحتوى.
2. **التحقق من هوية الموقّع:** يساعد على التأكد من أن التوقيع مرتبط بالمفتاح الخاص بالموقّع، مع الاعتماد على آلية موثوقة لربط المفتاح بهويته.
3. **عدم التنصل:** يوفر دليلًا يدعم أن الجهة المالكة للمفتاح الخاص قد وقّعت على البيانات، مما يجعل إنكار التوقيع لاحقًا أكثر صعوبة.
وبذلك يُستخدم التوقيع الرقمي لحماية سلامة الرسائل والمستندات الإلكترونية ودعم إثبات مصدرها.`),
E("ما هي الفوائد الأمنية الناتجة عن جمع عدة تقنيات أمان (التشفير، التوقيعات، الشهادات، المصادقة الثنائية) في سياق الخدمات المصرفية والتسوق الإلكتروني؟",
`يؤدي الجمع بين تقنيات الأمان المختلفة إلى توفير حماية متعددة الطبقات، وتتمثل فوائدها فيما يلي:
1. **التشفير:** يحمي سرية بيانات المستخدم والمعاملات المالية أثناء انتقالها عبر الشبكة.
2. **الشهادات الرقمية:** تساعد على التحقق من هوية الخادم واسم النطاق، مما يقلل خطر التعامل مع المواقع المزيفة.
3. **التوقيعات الرقمية:** تساعد على اكتشاف التلاعب بالبيانات والتحقق من هوية الموقّع، وتوفر دليلًا يدعم عدم التنصل.
4. **المصادقة الثنائية:** تقلل احتمال الدخول غير المصرح به إلى حسابات المستخدمين حتى إذا تسربت كلمات المرور.
**مثال:** عند استخدام تطبيق مصرفي، يحمي HTTPS الاتصال، وتساعد الشهادة الرقمية على التحقق من هوية الخادم، وتوفر المصادقة الثنائية حماية إضافية للحساب، ويمكن استخدام التوقيعات الرقمية لإثبات التوقيع على بيانات أو رسائل محددة عند الحاجة.
وبذلك تقل مخاطر التنصت والتلاعب وانتحال الهوية والوصول غير المصرح به.`),
E("ناقش بحرية لماذا لا تعني وسائل الأمان المتقدمة مثل TLS والمصادقة الثنائية أن الحماية مطلقة أو أن محتوى الموقع موثوق تماماً.",
`على الرغم من أن تقنيات مثل TLS والمصادقة الثنائية توفر مستويات متقدمة من الحماية، فإنها لا تعني أن الحماية مطلقة أو أن كل محتوى الموقع موثوق.
وذلك للأسباب التالية:
1. **وظيفة TLS محددة:** يحمي TLS البيانات أثناء انتقالها، ويساعد على التحقق من هوية الخادم وسلامة البيانات، لكنه لا يضمن أن المعلومات التي ينشرها الموقع صحيحة أو موثوقة.
2. **الشهادة الرقمية لا تثبت صدق المحتوى:** تساعد الشهادة على التحقق من هوية الخادم وارتباطه باسم النطاق، لكنها لا تثبت أن جميع المعلومات الموجودة على الموقع صحيحة.
3. **المصادقة الثنائية ليست حماية مطلقة:** يمكن أن يتعرض المستخدم للخداع للحصول على رمز التحقق، أو قد يُسرق الهاتف أو يتم اختراقه.
4. **وجود ثغرات أمنية:** قد يحتوي الموقع أو الخادم على ثغرات يمكن استغلالها رغم استخدام الاتصال المشفر.
5. **الأخطاء البشرية:** قد يشارك المستخدم بياناته مع جهة غير موثوقة أو يضغط على روابط احتيالية.
**الخلاصة:** وسائل الأمان تقلل المخاطر وتحمي جوانب مختلفة من الاتصال، لكنها لا تضمن الحماية المطلقة، كما أن تأمين الاتصال لا يعني بالضرورة موثوقية محتوى الموقع.`)],
[
M("خطوات إنشاء الاتصال الآمن والاتفاق على أسرار مشتركة تُشتق منها مفاتيح الجلسة تسمى:",["مصافحة TLS.","التشفير المتماثل.","التوقيع الرقمي.","الشهادة الرقمية."],0,"مصافحة TLS هي التي يتم خلالها التحقق من الشهادة والاتفاق على أسرار مشتركة تُشتق منها مفاتيح الجلسة."),
M("استخدام عاملين أو أكثر من فئات مختلفة لإثبات الهوية (مثل المعرفة والحيازة والسمات الحيوية) يسمى:",["المصادقة متعددة العوامل (MFA).","التشفير بالمفتاح العام.","مصافحة TLS.","التشفير المتماثل."],0,"هذا هو تعريف المصادقة متعددة العوامل، حيث يتم استخدام عاملين أو أكثر من فئات مختلفة لإثبات الهوية."),
M("أي مما يلي يُعد مثالاً على عامل «السمات الحيوية» في المصادقة؟",["كلمة المرور النصية.","بصمة الإصبع أو التعرف على الوجه.","بطاقة الصراف الآلي.","رمز التحقق عبر الرسائل القصيرة."],1,"بصمة الإصبع والتعرف على الوجه يعتمدان على صفات جسدية مميزة للمستخدم، ولذلك ينتميان إلى فئة السمات الحيوية."),
M("الاتصال والخدمات الآمنة عبر الإنترنت تعتمد بشكل أساسي على:",["تقنية واحدة فريدة ومطلقة.","الجمع بين التشفير والمصادقة والشهادات والتوقيعات الرقمية.","استخدام كلمات المرور البسيطة فقط.","إلغاء استخدام المفاتيح العامة والخاصة."],1,"لأن كل تقنية تؤدي وظيفة أمنية مختلفة، والجمع بينها يوفر طبقات حماية متعددة ويقلل المخاطر.")])
]},

{id:"l2",no:"الدرس الثاني",title:"تصميم أمان الشبكات",secs:[

S(1,"المهام الأدائية",[
E("اشرح ما المقصود بمفهوم «الدفاع في العمق» في أمان الشبكات، ولماذا يُعد توفير طبقات متعددة أضمن من الاعتماد على وسيلة حماية واحدة.",
`الدفاع في العمق (Defense in Depth) هو استراتيجية أمنية تعتمد على استخدام عدة طبقات من الضوابط والإجراءات الأمنية لحماية الشبكة والأنظمة والبيانات، بدلًا من الاعتماد على وسيلة حماية واحدة.
وتشمل هذه الطبقات:
- **جدار الحماية** لمراقبة حركة مرور الشبكة والسماح بها أو منعها وفق قواعد أمنية.
- **الشبكة الافتراضية الخاصة (VPN)** لحماية الاتصالات البعيدة وتشفير البيانات أثناء انتقالها عبر الشبكات غير الموثوقة.
- **المنطقة المعزولة (DMZ)** لفصل الخوادم المواجهة للجمهور عن الشبكة الداخلية.
- **ضوابط الأجهزة الطرفية**، مثل تثبيت برامج مكافحة الفيروسات وتحديث أنظمة التشغيل.
**لماذا تعد هذه الاستراتيجية أكثر أمانًا؟** لأن اختراق إحدى الطبقات لا يعني بالضرورة اختراق الشبكة بالكامل؛ حيث تستمر الطبقات الأخرى في توفير الحماية وتقليل أثر الهجوم.
**مثال:** إذا تمكن مهاجم من اختراق خادم ويب عام، فإن وضع الخادم داخل DMZ يساعد على منع وصوله المباشر إلى قواعد البيانات الحساسة الموجودة داخل الشبكة الداخلية.`),
E("وضح الدور الأساسي لجدار الحماية (Firewall) في أمان الشبكات، واذكر مثالاً على كيفية تحكمه في حركة المرور.",
`جدار الحماية (Firewall) هو نظام أو برنامج يراقب حركة مرور الشبكة، ويسمح بمرور البيانات أو يمنعها وفق مجموعة من القواعد الأمنية المحددة.
ويهدف إلى منع الاتصالات غير المصرح بها، والتحكم في حركة البيانات بين أجزاء الشبكة أو بينها وبين الشبكات الخارجية.
**مثال:** في مؤسسة تمتلك خادم ويب وقاعدة بيانات:
- يسمح جدار الحماية للمستخدمين من الإنترنت بالوصول إلى خادم الويب.
- يمنع الوصول الخارجي المباشر إلى قاعدة البيانات.
- يسمح فقط بالاتصالات المصرح بها بين خادم الويب وقاعدة البيانات وفق القواعد المحددة.
وبذلك يقلل جدار الحماية من فرص وصول المهاجمين إلى الموارد الحساسة.`)],
[
M("أي من الخيارات التالية يُعد التعريف الدقيق لمفهوم «الدفاع في العمق» في أمان الشبكات؟",["الاعتماد الكامل على جدار حماية قوي عند حدود الشبكة.","استخدام طبقات متعددة من الضوابط الأمنية بحيث تقلل الطبقات الأخرى الخطر إذا فشلت إحدى الطبقات.","منح الثقة التلقائية لجميع الأجهزة الموجودة داخل النطاق الجغرافي للمؤسسة.","تشفير حركة المرور بالكامل حصرياً عند استخدام شبكات Wi-Fi العامة."],1,"لأن الدفاع في العمق يعتمد على تعدد طبقات الحماية، بحيث لا يؤدي فشل إحدى الطبقات إلى كشف النظام بالكامل."),
M("ما هو المصطلح الذي يطلق على نظام أو برنامج يراقب حركة مرور الشبكة ويسمح بها أو يمنعها وفق قواعد أمنية محددة؟",["الشبكة الافتراضية الخاصة.","المنطقة المعزولة.","جدار الحماية.","نهج انعدام الثقة."],2,"جدار الحماية هو المسؤول عن مراقبة حركة مرور الشبكة وتطبيق قواعد السماح والمنع.")]),

S(1,"الواجبات المنزلية",[
E("ما المقصود بمصطلح «الشبكة الافتراضية الخاصة (VPN)»؟ اذكر اثنين من استخداماتها الرئيسية؟",
`الشبكة الافتراضية الخاصة (VPN – Virtual Private Network) هي اتصال أو شبكة منطقية خاصة يتم إنشاؤها عبر شبكة عامة مثل الإنترنت، وتستخدم التشفير وتقنيات النفق لحماية البيانات أثناء انتقالها.
من أهم استخداماتها:
1. تمكين الموظفين من الاتصال الآمن بشبكة المؤسسة من المنزل أو أثناء التنقل والعمل عن بُعد.
2. حماية البيانات أثناء استخدام شبكات غير موثوقة، مثل شبكات Wi-Fi العامة، من التنصت على محتوى الاتصال.`),
E("لماذا يكون وضع خادم ويب عام في «المنطقة المعزولة (DMZ)» أكثر أماناً من وضعه مباشرة داخل الشبكة الداخلية للمؤسسة؟",
`لأن المنطقة المعزولة (DMZ) توفر منطقة منفصلة توضع فيها الخوادم التي تحتاج إلى استقبال اتصالات من الشبكة الخارجية، مثل خوادم الويب والبريد الإلكتروني.
ويؤدي وضع خادم الويب في DMZ إلى:
1. فصل الخادم المواجه للجمهور عن الشبكة الداخلية للمؤسسة.
2. تقليل فرص وصول المهاجم مباشرة إلى قواعد البيانات والملفات الحساسة.
3. الحد من انتشار الهجوم داخل الشبكة إذا تمكن المهاجم من اختراق خادم الويب.
4. إمكانية التحكم في الاتصالات بين المنطقة المعزولة والشبكة الداخلية باستخدام قواعد جدران الحماية.
**مثال:** إذا تم اختراق خادم الويب الموجود في DMZ، فلن يحصل المهاجم تلقائيًا على إمكانية الوصول إلى قاعدة بيانات العملاء الموجودة داخل الشبكة الداخلية.`)],
[
M("ما هو المصطلح الذي يشير إلى اتصال أو شبكة منطقية خاصة تُنشأ عبر شبكة عامة مثل الإنترنت وتستخدم التشفير لحماية البيانات؟",["جدار الحماية.","الشبكة الافتراضية الخاصة (VPN).","المنطقة المعزولة (DMZ).","نهج انعدام الثقة."],1,"VPN تنشئ اتصالًا خاصًا عبر شبكة عامة وتستخدم التشفير لحماية البيانات أثناء انتقالها."),
M("أي من الخيارات الآتية يمثل الاستخدام الأنسب والأكثر شيوعاً للشبكة الافتراضية الخاصة (VPN) في بيئات العمل الحديثة؟",["الاتصال بأمان بشبكة المؤسسة من المنزل أو أثناء التنقل والعمل عن بعد.","حماية الأجهزة الطرفية من الفيروسات وإزالتها تلقائياً بدون برامج مساعدة.","مراقبة حركة مرور الشبكة المحلية ومنع البريد الإلكتروني العشوائي.","توفير منصات تتيح للمستخدمين نشر المحتوى ومشاركته بسرعة فائقة."],0,"من أشهر استخدامات VPN تمكين الموظفين من الوصول الآمن إلى شبكة المؤسسة من خارج مقر العمل.")]),

S(2,"المهام الأدائية",[
E("وضح المقصود بـ «المنطقة المعزولة (DMZ)» في تصاميم الشبكات، وكيف تحمي مكونات البنية التحتية الداخلية.",
`المنطقة المعزولة (DMZ – Demilitarized Zone) هي منطقة منفصلة في تصميم الشبكة توضع فيها الخوادم التي تحتاج إلى استقبال اتصالات من الشبكات الخارجية، مثل خوادم الويب والبريد الإلكتروني.
وتساعد في حماية البنية التحتية الداخلية من خلال:
1. عزل الخوادم العامة عن الشبكة الداخلية.
2. منع الوصول المباشر من الإنترنت إلى قواعد البيانات والأنظمة الحساسة.
3. التحكم في حركة المرور بين DMZ والشبكة الداخلية باستخدام جدران الحماية.
4. تقليل نطاق الضرر إذا تعرض أحد الخوادم العامة للاختراق.
وبذلك تعمل DMZ كمنطقة فاصلة تقلل احتمال انتقال الهجوم من الخوادم العامة إلى الأنظمة الداخلية للمؤسسة.`),
E("قارن بإيجاز بين الأمان التقليدي و«نهج انعدام الثقة (Zero Trust)» من حيث التعامل مع مستخدمي الشبكة الداخلية.",
`- **الأمان التقليدي:** يعتمد على مفهوم المحيط الأمني، حيث يفترض أن المستخدمين والأجهزة الموجودة داخل شبكة المؤسسة موثوق بها بدرجة أكبر، بينما تُعد الاتصالات القادمة من خارج الشبكة أكثر خطورة.
- **نهج انعدام الثقة (Zero Trust):** لا يمنح الثقة تلقائيًا لأي مستخدم أو جهاز لمجرد وجوده داخل شبكة المؤسسة أو امتلاكه جهازًا تابعًا لها، بل يتحقق من الهوية والصلاحيات والسياق عند كل طلب وصول.
**الفرق الأساسي:** الأمان التقليدي يعتمد بدرجة كبيرة على موقع المستخدم داخل الشبكة، أما Zero Trust فيعتمد على التحقق من كل عملية وصول وعدم منح الثقة التلقائية.`)],
[
M("ماذا يُقصد بمصطلح «المنطقة المعزولة (DMZ)» في هيكلة أمان الشبكات؟",["شبكة عامة مفتوحة بالكامل تتيح للمخترقين الوصول إلى قواعد البيانات الحساسة.","منطقة توضع فيها الخوادم المعرضة للشبكة الخارجية بشكل منفصل عن الشبكة الداخلية للمؤسسة.","برمجية خبيثة تقوم بمراقبة حركة المرور وتعديل قواعد جدار الحماية تلقائياً.","خط خاص افتراضي مشفر يربط بين الفروع المختلفة عبر الإنترنت العام."],1,"DMZ هي منطقة منفصلة تستضيف الخوادم المواجهة للجمهور، بهدف حماية الشبكة الداخلية من الاختراقات الخارجية."),
M("ما هي الفرضية الأساسية التي يعتمد عليها «نهج انعدام الثقة (Zero Trust)» في تأمين موارد المؤسسة؟",["اعتبار كل جهاز أو مستخدم داخل شبكة المؤسسة موثوقاً تماماً بشكل تلقائي.","عدم منح الثقة تلقائياً لمستخدم أو جهاز لمجرد وجوده داخل الشبكة أو ملكيته للمؤسسة وفحص الهوية والسياق.","الاعتماد المطلق على المحيط الأمني الخارجي وعدم فحص التطبيقات الداخلية.","تشفير رسائل البريد الإلكتروني فقط دون الاهتمام بصلاحيات الوصول للبيانات."],1,"الفكرة الأساسية في Zero Trust هي عدم الثقة التلقائية، والتحقق من الهوية والصلاحيات والسياق قبل السماح بالوصول.")]),

S(2,"أداءات منزلية",[
E("اشرح كيف تغيرت الفرضيات الأمنية حول «المحيط الأمني» التقليدي في ظل انتشار الحوسبة السحابية والعمل عن بعد.",
`كان الأمان التقليدي يعتمد على مفهوم **المحيط الأمني (Security Perimeter)**، الذي يفترض أن الأجهزة والمستخدمين الموجودين داخل شبكة المؤسسة آمنون وموثوقون، بينما تكون الاتصالات القادمة من خارج الشبكة غير موثوقة.
ولكن مع انتشار الحوسبة السحابية والعمل عن بُعد، تغير هذا المفهوم للأسباب التالية:
1. أصبح الموظفون قادرين على الوصول إلى موارد المؤسسة من منازلهم وأماكن مختلفة.
2. أصبحت البيانات والتطبيقات موجودة على خدمات سحابية قد لا تكون داخل شبكة المؤسسة.
3. لم يعد وجود المستخدم داخل شبكة المؤسسة دليلًا كافيًا على أنه موثوق.
4. أصبحت الأجهزة المختلفة والاتصالات الخارجية نقاطًا محتملة للهجوم.
لذلك ظهر **نهج انعدام الثقة (Zero Trust)**، الذي يعتمد على التحقق من هوية المستخدم والجهاز وصلاحياته وسياق الوصول، بدلًا من الاعتماد على الموقع داخل الشبكة فقط.`),
E("اذكر أمثلة على الإجراءات الأمنية الأربعة المرتبطة بطبقات الدفاع في العمق (مدخل الشبكة، مسار الاتصال، وضع الخوادم، الأجهزة الطرفية).",
`تتكون استراتيجية الدفاع في العمق من أربع طبقات أساسية في هذا الدرس:
1. **مدخل الشبكة:** استخدام جدار الحماية (Firewall) لمراقبة حركة المرور ومنع الاتصالات غير المصرح بها.
2. **مسار الاتصال:** استخدام الشبكة الافتراضية الخاصة (VPN) لتشفير الاتصالات وحماية البيانات أثناء انتقالها عبر الشبكات غير الموثوقة.
3. **وضع الخوادم:** استخدام المنطقة المعزولة (DMZ) لفصل الخوادم المواجهة للجمهور عن الشبكة الداخلية.
4. **الأجهزة الطرفية:** تثبيت برامج مكافحة الفيروسات وتحديث نظام التشغيل لحماية الأجهزة من البرمجيات الخبيثة والثغرات الأمنية.
وبذلك تتكامل هذه الطبقات لتقليل احتمال الاختراق والحد من أثره.`)],
[
M("ما هو المفهوم الذي يصف الحدود التقليدية التي تفترض أن ما بداخل شبكة المؤسسة آمن تماماً وما خارجها غير آمن والتي طمستها الخدمات السحابية والعمل عن بعد؟",["المنطقة المعزولة.","المحيط الأمني.","الحوسبة الطرفية.","التراكب الكمي."],1,"المحيط الأمني هو الحدود التقليدية التي تفصل الشبكة الداخلية الموثوقة عن الشبكات الخارجية غير الموثوقة."),
M("أي من طبقات «الدفاع في العمق» التالية ترتبط ارتباطاً مباشراً بتثبيت برامج مكافحة الفيروسات وتحديث نظام التشغيل؟",["مدخل الشبكة.","مسار الاتصال.","وضع الخوادم.","الأجهزة الطرفية."],3,"برامج مكافحة الفيروسات وتحديث نظام التشغيل يتم تطبيقها على أجهزة المستخدمين والخوادم، وتندرج ضمن ضوابط حماية الأجهزة الطرفية في تصنيف الدرس.")]),

S(3,"النموذج (A)",[
E("اشرح بالتفصيل كيف يعمل «الدفاع في العمق» على حماية المؤسسة بشكل أفضل من الاعتماد على وسيلة حماية واحدة، مستعيناً بما يحدث عند اختراق أحد الدفاعات.",
`الدفاع في العمق هو استراتيجية تعتمد على تكديس عدة طبقات من الحماية لتأمين الشبكة والأنظمة والبيانات.
وتشمل هذه الطبقات:
- جدار الحماية عند مدخل الشبكة للتحكم في حركة المرور.
- VPN لحماية مسار الاتصال وتشفير البيانات.
- DMZ لعزل الخوادم المواجهة للجمهور.
- ضوابط الأجهزة الطرفية، مثل برامج مكافحة الفيروسات وتحديث أنظمة التشغيل.
وتكمن أهميته في أن فشل إحدى الطبقات لا يعني انهيار جميع وسائل الحماية.
**مثال:** إذا تمكن مهاجم من اختراق خادم ويب عام، فإن وجوده داخل DMZ يقلل فرص وصوله إلى قاعدة البيانات الداخلية، كما يمكن لقواعد جدار الحماية منع الاتصالات غير المصرح بها، وتظل بقية طبقات الحماية فعالة.
وبذلك يقلل الدفاع في العمق احتمال الاختراق الكامل ويحد من نطاق الضرر الناتج عنه.`),
E("وضح الدور التقني لـ «جدار الحماية» في مراقبة حركة مرور الشبكة، ومثّل على ذلك بحماية قواعد البيانات.",
`جدار الحماية هو نظام أو برنامج يراقب حركة مرور الشبكة ويطبق قواعد أمنية تسمح باتصالات معينة وتمنع اتصالات أخرى وفقًا للسياسات المحددة.
**مثال على حماية قواعد البيانات:** في مؤسسة تمتلك خادم ويب وقاعدة بيانات للعملاء:
1. يسمح جدار الحماية للمستخدمين بالوصول إلى خادم الويب من الإنترنت.
2. يمنع الوصول الخارجي المباشر إلى قاعدة البيانات.
3. يسمح لخادم الويب بالاتصال بقاعدة البيانات وفق قواعد محددة.
4. يمنع الاتصالات غير المصرح بها.
وبذلك يحمي قاعدة البيانات من الوصول المباشر من أطراف خارجية غير مصرح لها.`),
E("اذكر المفهوم التفصيلي لـ «الشبكة الافتراضية الخاصة (VPN)» وبين كيف تحمي البيانات المنقولة عبر شبكات Wi-Fi العامة من التنصت.",
`الشبكة الافتراضية الخاصة (VPN) هي اتصال أو شبكة منطقية خاصة يتم إنشاؤها عبر شبكة عامة مثل الإنترنت، وتستخدم التشفير وتقنيات النفق لحماية البيانات أثناء انتقالها.
وعند استخدام VPN عبر شبكة Wi-Fi عامة:
1. ينشئ الجهاز اتصالًا مشفرًا عبر الشبكة العامة.
2. تنتقل البيانات من خلال نفق مشفر بين الجهاز والطرف الآخر في اتصال VPN.
3. يجعل التشفير محتوى البيانات غير مفهوم للأطراف التي قد تتمكن من اعتراض حركة المرور دون امتلاك مفاتيح فك التشفير المناسبة.
وبذلك تقل احتمالية قراءة البيانات أو التنصت على محتوى الاتصال أثناء انتقاله عبر شبكة غير موثوقة.`),
E("قارن بالتفصيل بين الأمان التقليدي ونهج انعدام الثقة (Zero Trust) موضحاً سبب عدم كفاءة التصاميم التقليدية وحدها حالياً.",
`|وجه المقارنة|الأمان التقليدي|نهج انعدام الثقة
|أساس الثقة|يعتمد على المحيط الأمني وموقع المستخدم داخل الشبكة|لا يمنح الثقة تلقائيًا لأي مستخدم أو جهاز
|المستخدم الداخلي|يُفترض غالبًا أنه موثوق|يجب التحقق من هويته وصلاحياته
|التحقق|يركز بدرجة كبيرة على الاتصالات القادمة من الخارج|يتحقق من طلبات الوصول وفق الهوية والسياق
|التعامل مع الأجهزة|قد تُمنح الأجهزة الداخلية ثقة أكبر|لا يُعتمد على ملكية الجهاز أو موقعه وحدهما
**سبب تراجع كفاءة الأمان التقليدي وحده:**
مع انتشار الحوسبة السحابية والعمل عن بُعد، أصبح المستخدمون يصلون إلى موارد المؤسسة من أماكن وأجهزة وشبكات مختلفة، كما أصبحت البيانات والتطبيقات موجودة خارج الشبكة الداخلية.
لذلك لم يعد من المنطقي اعتبار كل ما هو داخل الشبكة آمنًا تلقائيًا.
أما Zero Trust فيعتمد على التحقق من الهوية والصلاحيات والسياق عند طلب الوصول، مما يوفر حماية أنسب لبيئات العمل الحديثة.`)],
[
M("أي من الأجهزة أو الأنظمة التالية يراقب حركة مرور الشبكة ويسمح بها أو يمنعها وفق قواعد أمنية محددة؟",["جدار الحماية.","المنطقة المعزولة.","الشبكة الافتراضية الخاصة.","الحوسبة الطرفية."],0,"جدار الحماية هو المسؤول عن مراقبة حركة مرور الشبكة وتطبيق قواعد السماح والمنع."),

M("ما هو المصطلح الذي يعبر عن نهج أمني لا يمنح الثقة تلقائياً لمستخدم أو جهاز لمجرد وجوده داخل الشبكة؟",["الدفاع في العمق.","جدار الحماية.","نهج انعدام الثقة (Zero Trust).","الشبكة الافتراضية الخاصة."],2,"Zero Trust يعتمد على عدم منح الثقة التلقائية والتحقق من الهوية والصلاحيات والسياق."),
M("أي من الخيارات الآتية يمثل الاستخدام الرئيسي للشبكة الافتراضية الخاصة (VPN) لربط المكاتب أو الموظفين؟",["تشفير الاتصال وحماية البيانات عبر شبكات غير موثوقة أو العمل عن بعد.","التخلص التلقائي من الفيروسات الموجودة على القرص الصلب.","تسريع اتصالات الإنترنت العامة بدون الحاجة لكلمات مرور.","توفير واجهة رسومية لإدارة قواعد البيانات الضخمة."],0,"VPN تُستخدم لإنشاء اتصالات آمنة ومشفرة عبر الشبكات العامة، مما يساعد الموظفين على الاتصال بشبكة المؤسسة عن بُعد.")]),

S(3,"النموذج (B)",[
E("اشرح كيف تحمي «المنطقة المعزولة (DMZ)» شبكة المؤسسة الداخلية عند تعرض أحد خوادم الويب العامة للاختراق الهجومي الخارجي.",
`تساعد المنطقة المعزولة (DMZ) على حماية الشبكة الداخلية من خلال وضع خوادم الويب العامة في منطقة منفصلة عن الشبكة الداخلية للمؤسسة.
وعند تعرض خادم الويب للاختراق:
1. يظل الخادم المخترق داخل المنطقة المعزولة بدلًا من وجوده مباشرة داخل الشبكة الداخلية.
2. تمنع قواعد جدار الحماية الوصول المباشر وغير المصرح به من الخادم إلى الموارد الداخلية.
3. يتم تقييد الاتصالات بين DMZ والشبكة الداخلية وفق قواعد أمنية محددة.
4. يقل احتمال وصول المهاجم إلى قواعد البيانات والملفات الحساسة.
وبذلك تقلل DMZ نطاق الهجوم وتحد من تأثير اختراق الخادم العام، لكنها لا تضمن منع الاختراق أو انتقاله بشكل مطلق.`),
E("تحدث عن طبقات «الدفاع في العمق» الأربعة مبيناً الإجراء الأمني المرتبط بكل طبقة من مدخل الشبكة وحتى الأجهزة الطرفية.",
`تتكون استراتيجية الدفاع في العمق من أربع طبقات أساسية:
1. **مدخل الشبكة:** استخدام جدار الحماية لمراقبة حركة المرور والسماح بالاتصالات المصرح بها ومنع غير المصرح بها.
2. **مسار الاتصال:** استخدام VPN لتشفير الاتصالات وحماية البيانات أثناء انتقالها عبر الشبكات العامة.
3. **وضع الخوادم:** استخدام DMZ لفصل الخوادم المواجهة للجمهور عن الشبكة الداخلية.
4. **الأجهزة الطرفية:** تثبيت برامج مكافحة الفيروسات وتحديث أنظمة التشغيل لحماية الأجهزة من البرمجيات الخبيثة والثغرات الأمنية.
وتعمل هذه الطبقات معًا لتقليل فرص الاختراق والحد من أثره إذا نجح أحد المهاجمين في تجاوز إحدى الطبقات.`),
E("وضح كيف يساهم تطبيق «نهج انعدام الثقة (Zero Trust)» في التحقق من كل عملية وصول بناءً على الهوية والصلاحيات والسياق.",
`يعتمد نهج انعدام الثقة على عدم منح الثقة تلقائيًا لأي مستخدم أو جهاز لمجرد وجوده داخل شبكة المؤسسة أو امتلاكه جهازًا تابعًا لها.
ويتم التحقق من طلب الوصول من خلال:

S(1,"المهام الأدائية",[
E("ما المقصود بمصطلح «الحادث الأمني» وما هي أبرز الأمثلة النموذجية عليه ؟",
`الحادث الأمني هو حدث يؤثر في سرية المعلومات أو سلامتها أو توافرها، أو يهددها بجدية، أو يخالف سياسة أمنية متبعة داخل المؤسسة.
ومن أبرز الأمثلة النموذجية للحوادث الأمنية:
1. **تسرب المعلومات:** خروج المعلومات الشخصية أو السرية إلى جهات غير مصرح لها.
2. **التلاعب بالبيانات:** تعديل البيانات داخل نظام دون الحصول على تصريح أو إذن مناسب.

E("اشرح المراحل الست للاستجابة للحوادث، مبيناً الغرض الأساسي من مرحلتي «التحضير» و«الاكتشاف».",
`الاستجابة للحوادث هي مجموعة من الإجراءات المنظمة التي تتبعها المؤسسة عند وقوع حادث أمني بهدف السيطرة عليه وتقليل أضراره وإعادة الأنظمة إلى التشغيل الطبيعي.
وتتكون من ست مراحل أساسية:
1. **التحضير (Preparation):** إنشاء إجراءات وهياكل استجابة مسبقًا، وتجهيز الفريق والأدوات اللازمة للتعامل مع الحوادث.
2. **الاكتشاف (Detection):** اكتشاف وقوع الحادث الأمني والتأكد من حدوثه وتحديد طبيعته الأولية.
3. **الاحتواء (Containment):** عزل الجزء المتأثر أو تقييد أثر الحادث لمنع انتشار الضرر.
4. **إزالة التهديد (Eradication):** إزالة التهديد ومسبباته، مثل حذف البرمجيات الخبيثة ومعالجة الثغرة التي استغلها المهاجم.
5. **الاستعادة (Recovery):** إعادة الأنظمة والخدمات إلى حالة تشغيل آمنة وطبيعية، وقد تشمل الاستعادة من نسخة احتياطية سليمة.
6. **الدروس المستفادة والتحسين (Lessons Learned and Improvement):** تحليل ما حدث وتوثيق الدروس وتحسين الضوابط الأمنية لتقليل احتمال تكرار الحادث.

/* ---------- state ---------- */
const state={lesson:"l1",period:0,test:false,term:"",answers:{}};
const LET=["أ","ب","ج","د"];
const PNAME={1:"الفترة الأولى",2:"الفترة الثانية",3:"الفترة الثالثة"};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(s){
  let h=esc(s);
  if(state.term){const t=esc(state.term).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");h=h.replace(new RegExp("("+t+")","gi"),"<mark>$1</mark>")}
  return h;
}
function inline(s){return hl(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")}
/* markdown-lite renderer for model answers */
function renderAns(txt){
  const lines=txt.split("\n");let out="",i=0;
  const flush=(t,items)=>{if(items.length)out+=`<${t}>`+items.map(x=>`<li>${inline(x)}</li>`).join("")+`</${t}>`};
  while(i<lines.length){
    const L=lines[i];
    if(L.startsWith("|")){
      const rows=[];while(i<lines.length&&lines[i].startsWith("|")){rows.push(lines[i].slice(1).split("|"));i++}
      out+=`<div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;continue}
    if(L.startsWith("=")){out+=`<div class="eq">${inline(L.slice(1))}</div>`;i++;continue}
    if(/^- /.test(L)){const it=[];while(i<lines.length&&/^- /.test(lines[i])){it.push(lines[i].slice(2));i++}flush("ul",it);continue}
    if(/^\d+\. /.test(L)){
      /* numbered list; nested "- " bullets after an item attach to that item */
      const it=[];
      while(i<lines.length&&/^\d+\. /.test(lines[i])){
        let t=lines[i].replace(/^\d+\. /,"");i++;
        let sub=[];while(i<lines.length&&/^- /.test(lines[i])){sub.push(lines[i].slice(2));i++}
        it.push({t,sub});
      }
      out+="<ol>"+it.map(x=>`<li>${inline(x.t)}${x.sub.length?"<ul>"+x.sub.map(s=>`<li>${inline(s)}</li>`).join("")+"</ul>":""}</li>`).join("")+"</ol>";continue}
    if(L.trim()){out+=`<p>${inline(L)}</p>`}
    i++;
  }
  return out;
}
const CHECK=`<svg class="m" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;

function matches(item){
  if(!state.term)return true;
  const t=state.term.toLowerCase();
  const hay=item.m?[item.q,...item.o,item.w].join(" "):item.q+" "+item.a.replace(/[|*=]/g," ");
  return hay.toLowerCase().includes(t);
}
const lessonOf=id=>LESSONS.find(l=>l.id===id);
const counts=l=>({e:l.secs.reduce((n,s)=>n+s.e.length,0),m:l.secs.reduce((n,s)=>n+s.m.length,0)});

function renderNav(){
  const html=LESSONS.map(l=>{const c=counts(l);return `<button type="button" class="lesson-btn" data-l="${l.id}" aria-current="${l.id===state.lesson}"><span class="n">${l.no}</span><span class="t">${l.title}</span><span class="c">${c.e} مقالي · ${c.m} موضوعي</span></button>`}).join("");
  $("#rail").innerHTML=html;$("#mnav").innerHTML=html;
}
function secTitle(s){
  if(s.p===3)return `التقييمات الأسبوعية · ${s.t}`;
  return s.t;
}
function render(){
  const l=lessonOf(state.lesson),c=counts(l);
  let body="",shownE=0,shownM=0,totalMcq=0;
  const keyBase=l.id;
  l.secs.forEach((s,si)=>{
    if(state.period&&s.p!==state.period)return;
    const es=s.e.map((e,i)=>({...e,i})).filter(matches);
    const ms=s.m.map((m,i)=>({...m,i,m:1})).filter(matches);
    if(!es.length&&!ms.length)return;
    shownE+=es.length;shownM+=ms.length;
    body+=`<section class="sec"><div class="sec-h"><span class="tag">${PNAME[s.p]}</span><h3>${secTitle(s)}</h3></div>`;
    if(es.length){
      body+=`<div class="sub">الأسئلة المقالية</div><div class="cards">`+es.map(e=>`<article class="card"><p class="q"><span class="num">${e.i+1}</span><span>${hl(e.q)}</span></p>
        <details class="ans"${state.test?"":" open"}><summary>الإجابة النموذجية</summary><div class="ans-body">${renderAns(e.a)}</div></details></article>`).join("")+`</div>`;
    }
    if(ms.length){
      body+=`<div class="sub">الأسئلة الموضوعية (اختيار من متعدد)</div><div class="cards">`+ms.map(m=>{
        const key=`${keyBase}-${si}-${m.i}`;const picked=state.answers[key];
        const reveal=!state.test||picked!==undefined;
        const opts=m.o.map((o,oi)=>{
          let cls="opt";
          if(reveal){if(oi===m.c)cls+=" ok";else if(picked===oi)cls+=" bad"}
          return `<button type="button" class="${cls}" data-k="${key}" data-o="${oi}"${reveal?" disabled":""}><span class="l">${LET[oi]}</span><span>${hl(o)}</span>${CHECK}</button>`}).join("");
        return `<article class="card"><p class="q"><span class="num">${m.i+1}</span><span>${hl(m.q)}</span></p><div class="opts">${opts}</div>${reveal?`<div class="why"><b>التفسير:</b> ${hl(m.w)}</div>`:""}</article>`}).join("")+`</div>`;
    }
    body+=`</section>`;
  });
  /* total / answered for score */
  l.secs.forEach((s,si)=>s.m.forEach((m,i)=>{totalMcq++}));
  const ans=Object.keys(state.answers).filter(k=>k.startsWith(l.id+"-"));
  const right=ans.filter(k=>{const [,si,i]=k.split("-");return state.answers[k]===l.secs[+si].m[+i].c}).length;
  const isLast=false;
  if(!body)body=`<div class="empty">لا توجد نتائج مطابقة لبحثك.</div>`;
  /* review table after last lesson */
  let review="";
  if(l.id==="l3"&&!state.term&&!state.period){
    review=`<section class="sec"><div class="sec-h"><span class="tag">مراجعة</span><h3>ملاحظات علمية مهمة للمراجعة</h3></div>
    <p style="margin:0 0 10px;color:var(--muted)">تفرق هذه النقاط بين المفاهيم المتشابهة التي تكررت في التقييمات.</p>
    <div class="tbl plain"><table><thead><tr>${REVIEW.split("\n")[0].slice(1).split("|").map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${REVIEW.split("\n").slice(1).map(r=>`<tr>${r.slice(1).split("|").map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`;
  }
  const chips=[[0,"الكل"],[1,"الفترة الأولى"],[2,"الفترة الثانية"],[3,"الفترة الثالثة"]].map(([v,t])=>`<button type="button" class="chip" data-p="${v}" aria-pressed="${state.period===v}">${t}</button>`).join("");
  $("#main").innerHTML=`<header class="hero"><div><div class="k">${l.no}</div><h2>${l.title}</h2></div>
    <div class="stats"><div class="stat"><b>${c.e}</b><span>سؤال مقالي</span></div><div class="stat"><b>${c.m}</b><span>سؤال موضوعي</span></div></div></header>
    <div class="chips" role="group" aria-label="تصفية حسب الفترة">${chips}${state.test?`<span class="score">النتيجة: ${right} / ${ans.length} من ${totalMcq}</span>`:""}</div>${body}${review}`;
  renderNav();
  document.title="حل تقييمات الباب الثاني";
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const lb=e.target.closest("[data-l]");
  if(lb){state.lesson=lb.dataset.l;state.period=0;try{history.replaceState(null,"","#"+state.lesson)}catch(_){}render();window.scrollTo({top:0});return}
  const ch=e.target.closest("[data-p]");
  if(ch){state.period=+ch.dataset.p;render();return}
  const op=e.target.closest(".opt[data-k]");
  if(op&&!op.disabled){state.answers[op.dataset.k]=+op.dataset.o;render();return}
});
$("#mode").addEventListener("click",()=>{
  state.test=!state.test;state.answers={};
  const b=$("#mode");b.setAttribute("aria-pressed",state.test);b.querySelector(".lbl").textContent=state.test?"مراجعة":"اختبار";
  render();
});
let tm;$("#q").addEventListener("input",e=>{clearTimeout(tm);tm=setTimeout(()=>{state.term=e.target.value.trim();render()},150)});
$("#theme").addEventListener("click",()=>{
  const r=document.documentElement;
  const dark=r.dataset.theme==="dark";
  r.dataset.theme=dark?"light":"dark";
  try{localStorage.setItem("cq-theme",r.dataset.theme)}catch(_){}
});
try{const t=localStorage.getItem("cq-theme");if(t)document.documentElement.dataset.theme=t}catch(_){}
function route(){const h=location.hash.slice(1);if(LESSONS.some(l=>l.id===h)){state.lesson=h}}
addEventListener("hashchange",()=>{route();render()});
route();render();
</script>
