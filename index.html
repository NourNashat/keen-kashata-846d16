<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="claude:viewport-fit-sides" content="cover">
<title>البرمجة مع نور نشأت</title>
<script>/* تطبيق المظهر وحجم الخط قبل أول رسم لتفادي الوميض */
try{var d=document.documentElement,t=localStorage.getItem("cq-theme");if(t!=="light"&&t!=="dark")t="auto";d.dataset.pref=t;if(t!=="auto")d.dataset.theme=t;var f=parseFloat(localStorage.getItem("cq-fs"));if(f>=1&&f<=1.3)d.style.setProperty("--fs",f)}catch(e){document.documentElement.dataset.pref="auto"}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head><body>
<div class="bar"><div class="bar-in">
  <div class="brand" id="homeBtn" role="link" tabindex="0"><h1>البرمجة مع نور نشأت</h1></div>
  <label class="search"><span class="sr">ابحث في الأسئلة</span>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ابحث في الأسئلة والإجابات…" autocomplete="off"></label>
  <div class="tools">
    <button class="btn icon" id="savedBtn" type="button" aria-label="الأسئلة المحفوظة"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9L12 3.6z"/></svg><span class="badge" data-badge hidden></span></button>
    <button class="btn mode" id="mode" type="button" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg><span class="lbl">اختبار</span></button>
    <button class="btn icon" id="fontBtn" type="button" aria-label="تكبير الخط"><span class="fs-ic" aria-hidden="true">Aa</span></button>
    <button class="btn icon" id="theme" type="button" aria-label="تبديل المظهر"><span class="theme-ic i-auto"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></span><span class="theme-ic i-light"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span><span class="theme-ic i-dark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></button>
  </div>
</div></div>

<div class="wrap">
  <nav class="mnav" id="mnav" aria-label="التنقل"></nav>
  <div class="shell">
    <aside class="rail" aria-label="الدروس">
      <h2 id="railh">الأبواب</h2>
      <div id="rail" class="rail-list"></div>
      <div class="legend">
        <div><i style="background:var(--ok-bg);border:2px solid var(--ok)"></i>الإجابة الصحيحة</div>
        <div><i style="background:var(--bad-bg);border:2px solid var(--bad)"></i>اختيار خاطئ (وضع الاختبار)</div>
        <div>وضع الاختبار يخفي الإجابات لتجرب نفسك.</div>
      </div>
    </aside>
    <main id="main" aria-live="polite"></main>
  </div>
  <button type="button" id="toTop" aria-label="الرجوع لأعلى الصفحة" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
  <div class="foot">تم حل التقييمات بواسطة المهندس نور نشأت</div>
</div>

<nav class="bnav" id="bnav" aria-label="التنقل الرئيسي">
  <button type="button" data-bn="home" aria-current="page"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></span>الأبواب</button>
  <button type="button" data-bn="search" aria-pressed="false"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>بحث</button>
  <button type="button" data-bn="test" aria-pressed="false"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg></span>اختبار عام</button>
  <button type="button" data-bn="saved"><span class="pill"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9L12 3.6z"/></svg><span class="badge" data-badge hidden></span></span>المحفوظة</button>
</nav>
<script type="module" src="/src/main.js"></script>
</body></html>
